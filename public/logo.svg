<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a2f"/>
      <stop offset="100%" style="stop-color:#0f2318"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#b45309" stroke-width="4"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="215" fill="url(#inner)" stroke="#fbbf24" stroke-width="3"/>

  <!-- Dice 1 -->
  <g transform="translate(140,140) rotate(-15,50,50)">
    <rect x="10" y="10" width="90" height="90" rx="15" fill="white" stroke="#333" stroke-width="3"/>
    <circle cx="35" cy="35" r="8" fill="#1a1a1a"/>
    <circle cx="75" cy="35" r="8" fill="#1a1a1a"/>
    <circle cx="35" cy="75" r="8" fill="#1a1a1a"/>
    <circle cx="75" cy="75" r="8" fill="#1a1a1a"/>
    <circle cx="55" cy="55" r="8" fill="#1a1a1a"/>
  </g>

  <!-- Dice 2 -->
  <g transform="translate(280,140) rotate(12,50,50)">
    <rect x="10" y="10" width="90" height="90" rx="15" fill="white" stroke="#333" stroke-width="3"/>
    <circle cx="35" cy="55" r="8" fill="#dc2626"/>
    <circle cx="75" cy="55" r="8" fill="#dc2626"/>
  </g>

  <!-- Cards fan -->
  <g transform="translate(165,95) scale(0.5)">
    <rect x="0" y="0" width="60" height="85" rx="8" fill="white" stroke="#333" stroke-width="2" transform="rotate(-20,30,42)"/>
    <rect x="25" y="0" width="60" height="85" rx="8" fill="white" stroke="#333" stroke-width="2"/>
    <text x="55" y="55" font-size="32" font-weight="bold" fill="#dc2626" text-anchor="middle" font-family="serif">A</text>
    <text x="37" y="22" font-size="14" fill="#dc2626" font-family="serif">♠</text>
  </g>

  <!-- Coins -->
  <circle cx="340" cy="280" r="22" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
  <text x="340" y="287" font-size="20" font-weight="bold" fill="#7c2d12" text-anchor="middle" font-family="sans-serif">$</text>
  <circle cx="370" cy="305" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
  <text x="370" y="311" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle" font-family="sans-serif">$</text>

  <!-- Clover/luck -->
  <text x="175" y="120" font-size="28" fill="#10b981">☘</text>
  <text x="310" cy="130" font-size="22" fill="#10b981">★</text>

  <!-- Banner -->
  <path d="M60,340 Q256,300 452,340 L452,420 Q256,380 60,420 Z" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
  <path d="M80,345 Q256,310 432,345 L432,415 Q256,385 80,415 Z" fill="#f59e0b"/>

  <!-- Text: LUCKY ROLL -->
  <text x="256" y="375" font-size="48" font-weight="900" fill="#1a1a1a" text-anchor="middle" font-family="Arial Black, sans-serif" letter-spacing="2">LUCKY ROLL</text>
  <!-- Text: CASINO -->
  <text x="256" y="410" font-size="32" font-weight="900" fill="#1a1a1a" text-anchor="middle" font-family="Arial Black, sans-serif" letter-spacing="4">CASINO</text>

  <!-- Stars -->
  <text x="100" y="380" font-size="18" fill="#fef3c7">★</text>
  <text x="412" y="380" font-size="18" fill="#fef3c7">★</text>
</svg>
